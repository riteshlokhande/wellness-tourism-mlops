name: Wellness Tourism MLOps Pipeline

on:
  push:
    branches:
      - main

jobs:
  train-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: 'pip'

      - name: Install System Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
      - name: Execute Model Training
        run: |
          python model_training.py
          
      - name: Commit and Push Updated Model Artifact
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add wellness_model.joblib
          git commit -m "chore: retrain model with scikit-learn>=1.4.0" || echo "No changes to commit"
          git push
