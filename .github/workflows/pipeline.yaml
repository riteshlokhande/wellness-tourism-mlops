name: MLOps Automated CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  mlops-pipeline:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install System and Python Dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        wget -q https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-linux-amd64.tgz
        tar -xzf ngrok-v3-stable-linux-amd64.tgz
        sudo mv ngrok /usr/local/bin/

    - name: Establish MLflow Telemetry Tunnel
      env:
        NGROK_AUTH_TOKEN: ${{ secrets.NGROK_AUTH_TOKEN }}
      run: |
        # 1. Start local MLflow server in background
        nohup mlflow ui --host 0.0.0.0 --port 5000 > mlflow.log 2>&1 &
        
        # 2. Configure Ngrok auth token correctly
        ngrok config add-authtoken $NGROK_AUTH_TOKEN
        
        # 3. Start Ngrok tunnel in background
        nohup ngrok http 5000 > ngrok.log 2>&1 &
        
        # 4. Resilient polling loop to wait for Ngrok API to become available
        echo "Waiting for Ngrok tunnel API to initialize..."
        PUBLIC_URL=""
        for i in {1..15}; do
          response=$(curl -s http://localhost:4040/api/tunnels || true)
          PUBLIC_URL=$(echo "$response" | python -c "
import sys, json
try:
    data = json.load(sys.stdin)
    tunnels = data.get('tunnels', [])
    if tunnels:
        print(tunnels[0]['public_url'])
except Exception:
    pass
          ")
          if [ -n "$PUBLIC_URL" ]; then
            break
          fi
          sleep 2
        done
        
        if [ -z "$PUBLIC_URL" ]; then
          echo "❌ Failed to retrieve Ngrok public URL."
          cat ngrok.log
          exit 1
        fi
        
        echo "Ngrok Tunnel Established at: $PUBLIC_URL"
        echo "MLFLOW_TRACKING_URI=$PUBLIC_URL" >> $GITHUB_ENV

    - name: Data Registry
      run: |
        python data_register.py

    - name: Data Preparation
      run: |
        python data_preparation.py

    - name: Data Preprocessing
      run: |
        python -c "from data_preprocessing import get_preprocessor; print('✅ ColumnTransformer Preprocessing Pipeline verified successfully.')"

    - name: Hyperparameter Tuning and Model Training
      run: |
        python model_training.py

    - name: Archive Model Artifact
      uses: actions/upload-artifact@v4
      with:
        name: wellness-model-artifact
        path: model/wellness_model.joblib
