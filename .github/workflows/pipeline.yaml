name: MLOps CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  data-registry:
    name: 1. Data Registry
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Deps
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Data Registry
        run: python data_register.py

  data-prep:
    name: 2. Data Prep
    needs: data-registry
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Deps
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Data Preparation
        run: python data_preparation.py

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: training-data-artifacts
          path: artifacts/

  train:
    name: 3. Model Training
    needs: data-prep
    runs-on: ubuntu-latest
    env:
      PYTHONUNBUFFERED: "1"
      NGROK_AUTH_TOKEN: ${{ secrets.NGROK_AUTH_TOKEN }}
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Deps
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          name: training-data-artifacts
          path: artifacts/

      - name: Run Training & MLflow Tracking
        run: python model_training.py

      - name: Upload Model Artifact
        uses: actions/upload-artifact@v4
        with:
          name: wellness-model-artifact
          path: model/wellness_model.joblib

  verify:
    name: 4. Verify & Quality Gate
    needs: train
    runs-on: ubuntu-latest
    steps:
      - name: Download Model
        uses: actions/download-artifact@v4
        with:
          name: wellness-model-artifact
          path: model/
      
      - name: Quality Gate
        run: |
          echo "✅ Pipeline successfully completed!"
          echo "✅ Model artifact verified."
