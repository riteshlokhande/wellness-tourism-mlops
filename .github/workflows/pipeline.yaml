name: MLOps Multi-Job CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  data-infrastructure:
    name: 1. Data Registry & Preparation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Execute Data Registry & Preparation
        run: |
          python data_register.py
          python data_preparation.py

      - name: Upload Data Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: training-data-artifacts
          path: artifacts/

  model-training:
    name: 2. Hyperparameter Tuning & Model Training
    needs: data-infrastructure
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Download Data Artifacts from Prior Job
        uses: actions/download-artifact@v4
        with:
          name: training-data-artifacts
          path: artifacts/

      - name: Initialize Local MLflow Tracking & Execute Training
        env:
          MLFLOW_TRACKING_URI: sqlite:///mlflow.db
        run: |
          echo "✅ Initializing local MLflow tracking URI: $MLFLOW_TRACKING_URI"
          
          # Execute Model Training Pipeline locally with robust telemetry storage
          python model_training.py

      - name: Upload Trained Model Artifact
        uses: actions/upload-artifact@v4
        with:
          name: wellness-model-artifact
          path: model/wellness_model.joblib

  pipeline-verification:
    name: 3. Pipeline Verification & Quality Gate
    needs: model-training
    runs-on: ubuntu-latest
    steps:
      - name: Verify Artifact Availability
        uses: actions/download-artifact@v4
        with:
          name: wellness-model-artifact
          path: model/
      
      - name: Quality Gate Status
        run: |
          echo "✅ MLOps Pipeline successfully completed all dependent jobs!"
          echo "✅ Model artifact verified and ready for deployment."
