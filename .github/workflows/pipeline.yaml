name: MLOps Multi-Job CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  data-infrastructure:
    name: 1. Data Registry & Preparation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Execute Data Registry & Preparation
        run: |
          python data_register.py
          python data_preparation.py

      - name: Upload Data Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: training-data-artifacts
          path: artifacts/

  model-training:
    name: 2. Hyperparameter Tuning & Model Training
    needs: data-infrastructure
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies & Ngrok CLI
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          wget -q https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-linux-amd64.tgz
          tar -xzf ngrok-v3-stable-linux-amd64.tgz
          sudo mv ngrok /usr/local/bin/

      - name: Download Data Artifacts from Prior Job
        uses: actions/download-artifact@v4
        with:
          name: training-data-artifacts
          path: artifacts/

      - name: Debug and Verify Secret Availability
        env:
          NGROK_AUTH_TOKEN: ${{ secrets.NGROK_AUTH_TOKEN }}
        run: |
          echo "--- DEBUG: Checking NGROK_AUTH_TOKEN Availability ---"
          if [ -z "$NGROK_AUTH_TOKEN" ]; then
            echo "❌ CRITICAL: NGROK_AUTH_TOKEN secret is EMPTY or NOT FOUND in repository secrets!"
            exit 1
          else
            token_len=${#NGROK_AUTH_TOKEN}
            echo "✅ SUCCESS: NGROK_AUTH_TOKEN is present in the runner environment."
            echo "🔐 Token Character Length: $token_len"
            echo "🔐 Token Prefix Check: ${NGROK_AUTH_TOKEN:0:4}..."
          fi

      - name: Establish MLflow Telemetry Tunnel & Train
        env:
          NGROK_AUTH_TOKEN: ${{ secrets.NGROK_AUTH_TOKEN }}
        run: |
          # 1. Start MLflow server in background
          nohup mlflow ui --host 0.0.0.0 --port 5000 > mlflow.log 2>&1 &
          sleep 3
          
          # 2. Configure Ngrok auth token explicitly
          ngrok config add-authtoken "$NGROK_AUTH_TOKEN"
          nohup ngrok http 5000 > ngrok.log 2>&1 &
          
          # 3. Resilient polling loop for Ngrok v3 endpoints API
          echo "Waiting for Ngrok tunnel endpoint API to initialize..."
          PUBLIC_URL=""
          for i in {1..20}; do
            PUBLIC_URL=$(curl -s http://localhost:4040/api/endpoints | jq -r '.endpoints[0].public_url // empty' 2>/dev/null || true)
            if [ -n "$PUBLIC_URL" ] && [ "$PUBLIC_URL" != "null" ]; then
              break
            fi
            sleep 3
          done
          
          if [ -z "$PUBLIC_URL" ] || [ "$PUBLIC_URL" == "null" ]; then
            echo "❌ Failed to retrieve Ngrok public URL. Dumping ngrok.log and mlflow.log:"
            echo "--- NGROK LOG ---"
            cat ngrok.log
            echo "--- MLFLOW LOG ---"
            cat mlflow.log
            exit 1
          fi
          
          echo "MLFLOW_TRACKING_URI=$PUBLIC_URL" >> $GITHUB_ENV
          echo "✅ Telemetry Tunnel Established at: $PUBLIC_URL"

          # 4. Execute Model Training Pipeline
          python model_training.py

      - name: Upload Trained Model Artifact
        uses: actions/upload-artifact@v4
        with:
          name: wellness-model-artifact
          path: model/wellness_model.joblib

  pipeline-verification:
    name: 3. Pipeline Verification & Quality Gate
    needs: model-training
    runs-on: ubuntu-latest
    steps:
      - name: Verify Artifact Availability
        uses: actions/download-artifact@v4
        with:
          name: wellness-model-artifact
          path: model/
      
      - name: Quality Gate Status
        run: |
          echo "✅ MLOps Pipeline successfully completed all dependent jobs!"
          echo "✅ Model artifact verified and ready for deployment."
